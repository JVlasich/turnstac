# Tool config template. Every value shown = built-in default; uncomment to change.
# Precedence: CLI > this file > defaults.
# One file holds all namespaces: each tool reads its own section, ignores the rest


# =============================================================================
#  CATALOG BUILD                    turnstac <root> [--config cfg.yaml]
# =============================================================================

catalog:

  # ---- common ----

  # id: pielach
  # title: Pielach River Topo-Bathymetric LiDAR Time Series
  # description: Automated STAC catalog of the processed Pielach campaign datasets.

  # root: null             # processed-datasets root holding the campaign dirs;
  #                        # the CLI positional beats it
  # out: null              # catalog output dir (default: <root>/catalog)

  # only: null             # glob over campaign dir names, e.g. "202[45]-*";
  #                        # processes only those campaigns
  # force: false           # ignore the idempotency gate, rebuild every item; use after a
  #                        # registry/code change, best paired with only
  # thumbnails: true       # generate thumbnails for labels who declare it

  # --- advanced --------------------------------------------------------------
  # --- policies for when disk does not match expectation
  # stale: warn            # item/collection whose file vanished: warn | remove | raise
  # unknownAssets: warn    # file matches no registry pattern: warn | skip | raise
  # nonCloudNative: warn   # file with no COG/COPC twin: warn | skip | raise
  #                        # (skip = cloud-native-only catalog)
  # invalidCog: demote     # raster fails the COG structure validator: warn keep |
  #                        # demote to plain GeoTIFF | raise
  # idCollisions: warn     # same item/subcollection id in two campaigns: warn keep first
  #                        # owner | raise. Collection ids, and any collision inside one
  #                        # campaign, always raise

  # --- output / statistics
  # assetHrefs: absolute   # relative = catalog travels with the data;
  #                        # thumbnail href is always relative
  # minPoints: 1000        # drop point-cloud items below this pc:count
  # nbThreads: null        # opals threads, null = opals default = all CPUs
  # exactComputation: true # full scan: pc:statistics + real item datetime. false = header
  #                        # only, fast, no statistics, datetime falls back to campaign date

  # --- root metadata, license AND providers both set promote the root Catalog to a Collection
  # license: null          # SPDX id, or "other"
  # licenseLink: null      # rel=license link; "other" without one = spec grumble
  # providers: null        # STAC list form:
  #   - name: TU Wien, Department of Geodesy and Geoinformation
  #     roles: [processor, host]
  #     url: https://www.tuwien.at/mg/geo

  # --- debug ---
  # dryRun: false          # discover + gate only, report counts, write nothing
  # validate: false        # STAC-validate after save; needs pystac[validation]


