# Per-campaign sidecar. Copy into the campaign folder and name it "campaign.yaml".
# The campaign date comes from the folder name (its ISO token), never from here.
# Everything is optional. A normal campaign fills only the COMMON part below.


# =============================================================================
#  COMMON
# =============================================================================

collection:
  title: Pielach 2024-10-09
  description: >-
    This is a sample description 
    it can go over multiple lines
  license: other               # SPDX id, or "other"
  license_link: https://example.org/terms   # rel=license link; "other" without one only
                               # warns. snake_case here, camelCase in config.yaml
  keywords: [LiDAR, topo-bathymetry, point cloud, DSM, DTM, orthophoto, Pielach, river]
  providers:
    - name: TU Wien, Department of Geodesy and Geoinformation
      roles: [processor, host]
      url: https://www.tuwien.at/mg/geo
    - name: Sample Producer
      roles: [producer]

# Metadata attached to every item, then rolled up into the collection summaries.
# Per-product-type and per-item overrides: see ADVANCED.
properties:
  instruments: [riegl-vq-880-gii]
  platform: airborne


# =============================================================================
#  ADVANCED - rarely needed. Uncomment if wanted
# =============================================================================

# --- keep files out of the catalog -------------------------------------------
#
# exclude:
#   - pielach_2021-03-09.laz
#   - "*_draft.tif"


# --- CRS fallback ------------------------------------------------------------
# --- Read only when a file carries no CRS of its own.
#
# crs: EPSG:31256


# --- extra keys for the two blocks above -------------------------------------
# --- Add INSIDE "collection:":
#
#   id: pielach_2024-10-09     # default: <root catalog id>_<folder date>. A new id
#                              # creates a new collection and leaves the old one stale
#
#   providers:                 # short name-keyed form, same result as the list form
#     TU Wien, Department of Geodesy and Geoinformation:
#       roles: [processor, host]
#       url: https://www.tuwien.at/mg/geo
#
# --- Add INSIDE "properties:":
# --- A null value drops a key set here; extracted keys (gsd, proj:*, pc:*) stay on the item.
# --- Editing this block patches the affected items on the next run. REMOVING a key from it
# --- cannot be seen on the item that already carries it -> use --force
#
#   "pc:type": sonar           # extracted keys can be overwritten by setting them here;
#                              # point clouds are extracted as lidar
#   byLabel:
#     orthophoto:
#       instruments: null      # a camera product, so the scanner does not apply
#     pointcloud_copc:
#       "pc:type": sonar       # same override, point-cloud items only
#   byId:
#     pielach_2024-10-09_DTM_masked_etrs89:
#       title: DTM 2024-10-09, water surface masked   # overrides the generated item title


# --- subcollection layout ----------------------------------------------------
# --- Automatic rule: more than one file of the same category in one subdir makes that
# --- subdir a subcollection, named after itself. This block bends the rule.
#
# hierarchy:
#   placement:                 # item id -> group name, or ~ to force the item flat
#     pielach_2024-10-09_tile_017: pielach_2024-10-09_tiles
#     pielach_2024-10-09_overview: ~
#     "*_tile_*": pielach_2024-10-09_tiles    # Quote it: a bare * opens a YAML alias.
#                                             # exact key > pattern > automatic rule; among
#                                             # patterns the first one in this file wins.
#   groups:                    # metadata for the subcollection; providers and keywords
#     pielach_2024-10-09_tiles:                        # are inherited
#       title: Point cloud tiles 2024-10-09
#       description: COPC tiles on a 500 m grid.


# --- registry overrides ------------------------------------------------------
# --- A "patterns" entry replaces the whole default entry. An omitted require/forbid is empty
# --- and therefore matches anything, but extensions must be present or the pattern never
# --- fires. The stem is split on "_": every require token must be present and no forbid token
# --- may be. The most specific pattern wins (more require tokens first, then the longer file
# --- extension).
#
# patterns:
#   pointcloud:
#     extensions: [.laz, .las]           # accept plain .las as well
#   bathy_dtm:                           # a brand new pattern, needs its own label below
#     require: [dtm, bathy]
#     forbid: [shd]
#     extensions: [.tif, .tiff]
#
# --- A "labels" entry likewise replaces the whole default entry. An omitted key defaults to
# --- empty, which only makes sense for "category: ignore"; a real product needs every key.
# --- An unknown key in "patterns" or "labels" raises
#
# labels:
#   bathy_dtm:
#     category: dtm                      # item grouping and collection placement;
#                                        # "ignore" drops it
#     kind: raster                       # reader dispatch: raster | pcl
#     stac_roles: [data]
#     media_type: image/tiff; application=geotiff
#     extensions: [bands, projection, file, histogram]   # populators to run. Available:
#                                        # bands, projection, file, pointcloud, histogram.
#                                        
#     thumbnail: hillshade               # renderer: rgb | hillshade | pointcloud;
#                                        # null = no thumbnail
